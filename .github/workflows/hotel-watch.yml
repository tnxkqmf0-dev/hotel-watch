name: hotel-watch

# 동작 방식
# - public 레포: 한 번 시작하면 10분마다 확인을 약 5시간 50분 반복 → 끝나면 스스로 다음 실행을 걸어 이어감
#   (GitHub cron은 자주 밀리거나 건너뛰어서 cron에만 의존하지 않음. public은 Actions 무료 무제한)
# - private 레포: 무료 한도 보호를 위해 반복 없이 1회만 확인
# - cron은 체인이 끊겼을 때 다시 살리는 백업 역할

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = 지금 공실 현황 받기 / loop = 감시 반복 시작 / check = 1회 확인"
        default: "test"
        type: choice
        options: [test, loop, check]

permissions:
  contents: write   # state.json 커밋
  actions: write    # 다음 실행 예약(자기 자신 재호출)

concurrency:
  group: hotel-watch
  cancel-in-progress: false

env:
  INTERVAL_SEC: 600          # 확인 간격 10분
  LOOP_MINUTES: 350          # 한 실행에서 반복할 시간 (잡 최대 6시간 이내)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실행 방식 결정
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE=loop            # cron 실행은 반복 모드
          PRIVATE=$(gh api "repos/${{ github.repository }}" --jq .private)
          if [ "$MODE" = "loop" ] && [ "$PRIVATE" = "true" ]; then
            echo "private 레포라 반복 없이 1회만 확인합니다 (public으로 바꾸면 자동 반복)" >> "$GITHUB_STEP_SUMMARY"
            MODE=check
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: 공실 확인
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
          PLAN: ${{ steps.plan.outputs.mode }}
        run: |
          git config user.name  "hotel-watch-bot"
          git config user.email "hotel-watch-bot@users.noreply.github.com"

          save_state() {
            git add state.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -qm "update state [skip ci]"
              git pull -q --rebase || true
              git push -q || echo "state push 실패(다음 회차에 재시도)"
            fi
          }

          if [ "$PLAN" != "loop" ]; then
            MODE="$PLAN" python check.py || true
            save_state
            exit 0
          fi

          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          n=0
          while :; do
            n=$((n+1))
            echo "::group::확인 #$n  $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
            MODE=check python check.py || true
            save_state
            echo "::endgroup::"
            if python -c "import json,datetime as d;c=json.load(open('config.json'));exit(0 if d.datetime.now(d.timezone(d.timedelta(hours=9))).date()>d.date.fromisoformat(c['stop_after']) else 1)"; then
              echo "감시 기간 종료 → 반복 중단" >> "$GITHUB_STEP_SUMMARY"
              echo "STOPPED=1" >> "$GITHUB_ENV"
              break
            fi
            [ $(( $(date +%s) + INTERVAL_SEC )) -ge $END ] && break
            sleep "$INTERVAL_SEC"
          done
          echo "총 ${n}회 확인 완료" >> "$GITHUB_STEP_SUMMARY"

      - name: 다음 실행 예약 (체인 유지)
        if: steps.plan.outputs.mode == 'loop' && env.STOPPED != '1' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hotel-watch.yml --ref "${{ github.ref_name }}" -f mode=loop
